    function renderPlatformArchitecture(){
    const key=location.hash.slice(1); const current=modules[key]||modules.vpp; const active=modules[key]?key:'vpp';
    document.title=current.name+'业务架构｜EMS 智慧能源运营平台'; document.querySelector('#current-position').textContent=current.name; document.querySelector('#title').textContent=current.name+'业务架构'; document.querySelector('#lead').textContent=current.lead; document.querySelector('#diagram-title').textContent=current.name+'业务架构图 · 反馈—执行—决策—数据'; document.querySelector('#diagram-desc').textContent=current.desc+' 架构按反馈、执行、决策、数据四层闭环展示。';
    document.querySelector('#tabs').innerHTML=Object.entries(modules).map(([id,item])=>`<a class="${id===active?'active':''}" href="platform-architecture.html#${id}">${item.name}</a>`).join('');
    const relationshipLanes=[['反馈层 · 成效与运行反馈',current.outcomes],['执行层 · '+current.lanes[2][0],current.lanes[2][1]],['决策层 · '+current.lanes[1][0],current.lanes[1][1]],['数据层 · '+current.lanes[0][0],current.lanes[0][1]]];
    const relationshipLabels=['经营反馈下达 · 执行结果回传','任务计划下达 · 运行偏差回传','策略指令下达 · 实时数据回传'];
    document.querySelector('#flow').innerHTML=relationshipLanes.map((lane,index)=>`<section class="lane relationship-layer relationship-${index}"><div class="lane-name">${lane[0]}</div><div class="cards">${lane[1].map((card,i)=>`<div class="card ${index===2?'smart':index===1&&i===3?'outer':''}"><b>${card[0]}</b><small>${card[1]}</small></div>`).join('')}</div></section>${index<relationshipLanes.length-1?`<div class="arrow" aria-label="${relationshipLabels[index]}"><span>${relationshipLabels[index]}</span></div>`:''}`).join('');
    document.querySelector('#outcome').innerHTML='';
    }
    renderPlatformArchitecture();
    window.addEventListener('hashchange',renderPlatformArchitecture);
    window.EMSLocalData.persistPage({ id: 'platform-architecture.html', kind: 'platform-architecture' });
  </script>
