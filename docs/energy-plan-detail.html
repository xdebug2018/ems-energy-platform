  .d-card{padding:19px;border:1px solid #d5e4f2;border-radius:15px;background:#fff;box-shadow:0 8px 20px rgba(25,90,160,.05)}
  .d-card h3{margin:0 0 9px;color:#123f75;font-size:16px;display:flex;align-items:center;gap:8px}
  .d-card h3 i{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:9px;background:#e8f3ff;color:#1467c5;font-size:13px;font-weight:800;font-style:normal}
  .d-card ul{margin:0;padding-left:17px;display:grid;gap:6px}
  .d-card li{color:#3c5e80;font-size:13.5px;font-weight:500;line-height:1.65}
  .d-p{margin:0;color:#46647e;font-size:14.5px;font-weight:500;line-height:1.8}
  .step-io{margin:9px 0 0;display:grid;gap:5px;padding:10px 12px;border:1px dashed #c9def2;border-radius:10px;background:#f8fbff}
  .step-io div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;font-size:12.5px;line-height:1.55;align-items:start}
  .step-io dt{color:#6b8299;font-weight:800;white-space:nowrap}
  .step-io dd{margin:0;color:#3c5e80;font-weight:500}
  .step-io .err dd{color:#a3541e}
  .plan-detail-btn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;padding:9px 16px;border-radius:11px;background:linear-gradient(135deg,#1467c5,#3f92e6);color:#fff;font-size:13.5px;font-weight:800;box-shadow:0 8px 18px rgba(20,103,197,.25)}
  .plan-detail-btn:hover{filter:brightness(1.07)}
  .mx-detail{margin-left:8px;padding:2px 8px;border-radius:7px;background:#eaf4ff;color:#0f5fac;font-size:11.5px;font-weight:800;white-space:nowrap}
  .mx-detail:hover{background:#1467c5;color:#fff}
  .d-nav{display:flex;justify-content:space-between;gap:14px;margin:34px 0 44px}
  .d-nav a{flex:1;padding:13px 18px;border:1px solid #cfe1f3;border-radius:13px;background:#fff;color:#23588f;font-weight:700;font-size:14px;line-height:1.5}
  .d-nav a:hover{border-color:var(--blue);background:#eaf4ff}
  .d-nav a.next{text-align:right}
  .d-nav small{display:block;color:#7d95ab;font-size:12px;font-weight:600}
  .syn-list{margin:0;padding:0;list-style:none;display:grid;gap:9px}
  .syn-list li{position:relative;padding:11px 15px;border:1px solid #dbe9f6;border-radius:12px;background:#f8fbff;color:#3c5e80;font-size:13.5px;font-weight:500;line-height:1.65}
  .syn-list li::before{content:'';position:absolute;left:-1px;top:11px;bottom:11px;width:3px;border-radius:2px;background:#4a9ae8}
  .syn-list a{color:#0f5fac;font-weight:800}
  .syn-list a:hover{text-decoration:underline}
  .acc-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
  .acc-list li{display:flex;gap:9px;align-items:start;color:#2f587f;font-size:14px;font-weight:600;line-height:1.6}
  .acc-list li i{display:grid;place-items:center;flex:none;width:22px;height:22px;margin-top:1px;border-radius:50%;background:#e3f5ec;color:#15734f;font-size:12px;font-weight:800;font-style:normal}
  @media(max-width:850px){.d-2col{grid-template-columns:1fr}.step-io div{grid-template-columns:52px minmax(0,1fr)}.d-nav{flex-direction:column}}
  /* 收益测算工具（追加于样式块末尾） */
  .calc-wrap{display:grid;gap:16px}
  .calc-inputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .calc-in{display:flex;flex-direction:column;gap:6px;padding:13px 15px;border:1px solid #d5e4f2;border-radius:12px;background:#fff}
  .calc-in span{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:#2f587f;font-size:13px;font-weight:700}
  .calc-in em{color:#7d95ab;font-style:normal;font-size:12px;font-weight:600;white-space:nowrap}
  .calc-in input{width:100%;padding:8px 10px;border:1px solid #cfe1f3;border-radius:9px;background:#f8fbff;color:#0f3a6e;font:800 16px/1.4 "Microsoft YaHei","微软雅黑","Segoe UI",Arial,sans-serif}
  .calc-in input:focus{outline:none;border-color:var(--blue);background:#fff}
  .calc-outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .calc-out{padding:15px 17px;border:1px solid #dbe9f6;border-radius:13px;background:#f8fbff}
  .calc-out.hl{border-color:#9ecbf2;background:linear-gradient(145deg,#e8f3ff,#f4faff);box-shadow:0 8px 18px rgba(20,103,197,.1)}
  .calc-out small{display:block;color:#6b8299;font-size:12.5px;font-weight:700}
  .calc-out b{display:block;margin-top:5px;color:#0f3a6e;font-size:25px;line-height:1.2;letter-spacing:-.01em;font-weight:800}
  .calc-out b span{margin-left:5px;color:#45627c;font-size:13px;font-weight:700;letter-spacing:0}
  .calc-out p{margin:7px 0 0;color:#7d95ab;font-size:12px;font-weight:500;line-height:1.55}
  .calc-note{margin:0;padding:11px 14px;border:1px dashed #c9def2;border-radius:10px;background:#f8fbff;color:#7d95ab;font-size:12.5px;font-weight:500;line-height:1.6}
  @media(max-width:850px){.calc-inputs{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:650px){.calc-inputs{grid-template-columns:1fr}.calc-out b{font-size:22px}}
  /* 区域选择器（追加于样式块末尾） */
  .calc-region{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border:1px solid #c9def2;border-radius:12px;background:linear-gradient(135deg,#e8f3ff,#f4faff)}
  .calc-region label{color:#114c8d;font-size:14px;font-weight:800;white-space:nowrap}
  .calc-region select{padding:8px 12px;border:1px solid #cfe1f3;border-radius:9px;background:#fff;color:#0f3a6e;font:700 14px/1.4 "Microsoft YaHei","微软雅黑","Segoe UI",Arial,sans-serif;cursor:pointer}
  .calc-region select:focus{outline:none;border-color:var(--blue)}
  .calc-region small{flex:1;min-width:260px;color:#5f7d97;font-size:12.5px;font-weight:500;line-height:1.6}
</style>
</head>
<body>

  <header class="shell topbar"><a class="brand" href="index.html"><img class="brand-logo" src="swaychip-logo.png" alt="中感睿思 SWAYCHIP" /><span>EMS 智慧能源运营解决方案</span></a><nav class="site-nav" aria-label="站点导航"><a href="index.html">首页</a><a href="policy.html">政策背景</a><a href="architecture.html">业务架构</a><a href="modules.html">功能模块</a><a href="ai-strategy.html">算法预测</a><a class="current" href="energy-plan.html">能量方案</a><a href="energy-equipment.html">场站设备</a><a href="bids.html">招标信息</a></nav><a class="back" href="energy-plan.html">← 返回能量方案</a></header>

<main class="shell">
    <div class="breadcrumb" aria-label="当前位置"><a href="index.html">首页</a><span class="sep">/</span><a href="energy-plan.html">能量方案</a><span class="sep">/</span><strong id="bcName">方案详情</strong></div>

    <section class="hero" style="padding-bottom:14px">
      <div class="eyebrow" id="dEyebrow">ENERGY PLAN · DETAIL</div>
      <h1 id="dTitle">方案详情</h1>
      <p class="lead" id="dLead"></p>
      <div class="d-meta" id="dMeta"></div>
    </section>

    <div id="detailMain"></div>

    <nav class="d-nav" id="dNav" aria-label="上一篇下一篇"></nav>
</main>

<footer class="shell footer"><span>© 2026 EMS 智慧能源运营解决方案</span><span>能量方案详情 · 详细设计 · 配置参数 · 业务流程 · AI 作用 · 验收标准</span></footer>
<script src="site-data.js"></script>
<script src="energy-plan-data.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const data = window.EMSPlanData;
    const idx = data.plans.findIndex(p => p.id === id);
    if (idx < 0) { location.replace('energy-plan.html'); }
    else {
      const plan = data.plans[idx];
      const det = data.detail[plan.id];
      const catCls = { '安全类': 'ultra', '经济类': 'short', '市场类': 'mid' }[plan.cat] || 'ultra';
      document.title = plan.name + ' · 详细方案｜EMS 智慧能源运营解决方案';
      document.getElementById('bcName').textContent = plan.no + ' ' + plan.name;
      document.getElementById('dEyebrow').textContent = 'ENERGY PLAN · DETAIL · ' + plan.no;
      document.getElementById('dTitle').innerHTML = esc(plan.name) + '<span class="plan-cat">' + esc(plan.cat) + '</span>';
      document.getElementById('dLead').textContent = det.positioning;
      document.getElementById('dMeta').innerHTML = [
        '<span><b>触发方式</b>　' + esc(plan.trigger) + '</span>',
        '<span><b>响应颗粒度</b>　' + esc(plan.grain) + '</span>',
        '<span><b>执行性质</b>　' + esc(plan.nature) + '</span>',
        '<span><b>AI 关键作用</b>　' + esc(plan.aiBrief) + '</span>',
        '<span class="scale-tag ' + catCls + '" style="align-self:center">' + esc(plan.cat) + '</span>'
      ].join('');

      const sec = (no, title, desc, inner) => '<section class="platform" id="sec' + no + '"><div class="platform-head"><div class="number">' + no + '</div><div><h2>' + title + '</h2><p>' + desc + '</p></div></div>' + inner + '</section>';
      const table = (heads, rows) => '<div class="function-table-wrap"><table class="function-table flow"><thead><tr>' + heads.map(h => '<th scope="col">' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((c, i) => i === 0 ? '<th scope="row">' + c + '</th>' : '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';

      let html = '';
      html += sec('01', '适用场景与实施前提', '方案落地的典型业务场景与必须满足的前提条件。三者同时成立时，方案才能按预期发挥价值。', '<div class="d-2col"><div class="d-card"><h3><i>景</i>适用场景</h3><ul>' + det.scenes.map(s => '<li>' + s + '</li>').join('') + '</ul></div><div class="d-card"><h3><i>前</i>实施前提</h3><ul>' + det.pre.map(s => '<li>' + s + '</li>').join('') + '</ul></div></div>');

      html += sec('02', '策略配置参数', '方案运行依赖的核心参数、默认取值与配置说明。安全类参数为硬约束，经济类参数在约束内寻优。', table(['参数', '默认值 / 取值', '配置说明'], det.params.map(p => [esc(p[0]), '<b>' + esc(p[1]) + '</b>', esc(p[2])])));

      html += sec('03', '详细业务流程', '六个步骤的输入、处理与输出，以及每一步的异常与降级策略。蓝色标注步骤为 AI 作用环节。', '<ol class="flow-list">' + plan.flow.map((step, i) => {
        const io = det.stepIO[i] || {};
        return '<li class="flow-row' + (step.ai ? ' ai' : '') + '"><span class="flow-dot">' + (i + 1) + '</span><div class="flow-body"><h5>' + esc(step.t) + (step.ai ? '<span class="ai-flag">AI</span>' : '') + '</h5><p>' + esc(step.d) + '</p>' + (step.ai ? '<p class="ai-note"><b>AI 作用</b>' + esc(step.ai) + '</p>' : '') + '<dl class="step-io"><div><dt>输入</dt><dd>' + esc(io.i || '—') + '</dd></div><div><dt>输出</dt><dd>' + esc(io.o || '—') + '</dd></div><div class="err"><dt>异常</dt><dd>' + esc(io.e || '—') + '</dd></div></dl></div></li>';
      }).join('') + '</ol>');

      html += sec('04', '界面与交互设计', '方案在平台中的功能页面划分与各自的核心要素，覆盖监控、配置、执行与复盘全闭环。', table(['页面 / 模块', '功能要点'], det.ui.map(u => [esc(u[0]), esc(u[1])])));

      html += sec('05', '数据采集与系统接口', '方案运行需要采集的数据项及来源频率，以及与外部系统的接口交互方向。', '<div class="d-2col"><div>' + table(['数据项', '来源 · 频率'], det.data.map(d => [esc(d[0]), esc(d[1])])) + '</div><div>' + table(['对接系统', '交互内容与方向'], det.iface.map(f => [esc(f[0]), esc(f[1])])) + '</div></div>');

      html += sec('06', 'AI 算法设计', '方案内置的 AI 能力：输入 → 输出 → 闭环方式。AI 不替代规则，而是在规则之上补足预判、寻优与自学习。', '<div class="d-2col">' + det.ai.map((a, i) => '<div class="d-card"><h3><i>' + (i + 1) + '</i>' + esc(a[0]) + '</h3><p class="d-p">' + esc(a[1]) + '</p></div>').join('') + '</div>');

      html += sec('07', '异常场景与降级策略', '每一个异常场景都有明确的降级路径：先保安全与保供，再保收益，全过程留痕可追溯。', table(['异常场景', '处理与降级策略'], det.exc.map(x => [esc(x[0]), esc(x[1])])));

      html += sec('08', '与其他方案的协同', '方案不是孤岛：与其余能量方案按“安全 > 考核 > 收益”的优先级协同运行。', '<ul class="syn-list">' + det.syn.map(s => '<li>' + s + '</li>').join('') + '</ul>');

      html += sec('09', 'KPI 与验收标准', '方案交付的量化验收口径，也是投运后持续评估的指标基线。', '<div class="ai-strip"><span class="ai-strip-label">考核指标</span><ul>' + plan.kpi.map(k => '<li>' + esc(k) + '</li>').join('') + '</ul></div><ul class="acc-list" style="margin-top:14px">' + det.acc.map(a => '<li><i>✓</i>' + esc(a) + '</li>').join('') + '</ul>');

      if (det.calc) {
        const c = det.calc;
        html += sec('10', '收益测算工具', c.intro, '<div class="calc-wrap" id="calcBox"><div class="calc-region"><label for="calcStation">场站类型</label><select id="calcStation"></select><small id="calcStationNote"></small></div><div class="calc-region"><label for="calcRegion">所属区域</label><select id="calcRegion"></select><small id="calcRegionNote"></small></div><div class="calc-inputs">' + c.inputs.map(inp => '<label class="calc-in"><span>' + esc(inp.label) + '<em>' + esc(inp.unit) + '</em></span><input type="number" value="' + inp.v + '" step="' + inp.step + '" min="0" data-k="' + inp.k + '" aria-label="' + esc(inp.label) + '" /></label>').join('') + '</div><div class="calc-outs" id="calcOuts"></div><p class="calc-note">场站类型自动填入该类典型单站的资源参数（充电量、谷移比例、储能容量、投资、响应频次等），所属区域自动填充当地峰谷价差、基本电价与需求响应补偿的现行典型口径（均可手动微调）；测算为静态估算，结果随电价政策、市场行情与执行率浮动，接入平台后按真实运行数据自动核算。</p></div>');
      }

      document.getElementById('detailMain').innerHTML = html;

      if (det.calc) {
        const box = document.getElementById('calcBox');
        const recompute = () => {
          const v = {};
          box.querySelectorAll('input[data-k]').forEach(inp => { v[inp.dataset.k] = parseFloat(inp.value) || 0; });
          document.getElementById('calcOuts').innerHTML = det.calc.out(v).map(o => '<div class="calc-out' + (o.hl ? ' hl' : '') + '"><small>' + esc(o.label) + '</small><b>' + o.val + '<span>' + esc(o.unit) + '</span></b><p>' + esc(o.formula) + '</p></div>').join('');
        };
        box.addEventListener('input', recompute);

        // 区域联动：按区域现行典型口径填充价差 / 基本电价 / DR 补偿 / VPP 单价
        const regions = (data.regions || []);
        const reg = document.getElementById('calcRegion');
        const regNote = document.getElementById('calcRegionNote');
        const regMap = { spr: 'spr', pr: 'dem', drPr: 'dr', vpr: 'vpp' };
        reg.innerHTML = '<option value="-1">自定义参数</option>' + regions.map((r, i) => '<option value="' + i + '">' + esc(r.name) + '</option>').join('');
        const applyRegion = () => {
          const r = regions[+reg.value];
          if (r) {
            box.querySelectorAll('input[data-k]').forEach(inp => { if (regMap[inp.dataset.k] !== undefined) inp.value = r[regMap[inp.dataset.k]]; });
            regNote.textContent = r.name + ' · ' + r.note;
          } else {
            regNote.textContent = '使用下方手动输入参数';
          }
          recompute();
        };
        reg.addEventListener('change', applyRegion);
        reg.value = '0';
        applyRegion();

        // 场站类型联动：填充该类典型单站的资源参数（资源量与投资；价格口径由「所属区域」控制）
        const stations = (data.stations || []);
        const stSel = document.getElementById('calcStation');
        const stNote = document.getElementById('calcStationNote');
        if (stations.length && stSel) {
          const r10 = n => Math.round(n / 10) * 10;
          const stMap = {
            'order-charge': { chg: p => p.chg, shift: p => p.sh },
            'capacity': { pk: p => r10(p.xf * 0.2), inv: p => p.inv },
            'arbitrage': { cap: p => p.ess, inv: p => p.inv },
            'demand': { dm: p => r10(p.xf * 0.8) },
            'vpp': { cap: p => r10(p.xf * 0.25) },
            'dr-day': { cap: p => r10(p.xf * 0.25 * 0.7), n: p => p.drN, h: p => p.drH },
            'dr-interrupt': { cap: p => r10(p.xf * 0.25 * 0.7), n: p => p.drN, h: p => p.drH }
          }[plan.id] || {};
          const stDesc = s => {
            const p = s.params, parts = [];
            if (p.xf) parts.push('变压器 ' + p.xf + ' kVA');
            if (p.chg) parts.push('日充电 ' + p.chg + ' kWh');
            if (p.sh !== undefined) parts.push('谷移 ' + p.sh + '%');
            if (p.ess) parts.push('储能 ' + p.ess + ' kWh');
            if (p.inv) parts.push('储能投资 ' + p.inv + ' 万元');
            if (p.drN) parts.push('年响应 ' + p.drN + ' 次 × ' + p.drH + 'h');
            return s.icon + ' ' + s.name + ' · 典型单站：' + parts.join(' · ');
          };
          stSel.innerHTML = '<option value="-1">通用典型参数</option>' + stations.map((s, i) => '<option value="' + i + '">' + esc(s.name) + '</option>').join('');
          const applyStation = () => {
            const s = stations[+stSel.value];
            if (s) {
              box.querySelectorAll('input[data-k]').forEach(inp => { const f = stMap[inp.dataset.k]; if (f) inp.value = f(s.params); });
              stNote.textContent = stDesc(s);
            } else {
              stNote.textContent = '使用下方通用默认参数';
            }
            recompute();
          };
          stSel.addEventListener('change', applyStation);
          stSel.value = '-1';
          applyStation();
        }
      }

      const prev = data.plans[idx - 1], next = data.plans[idx + 1];
      document.getElementById('dNav').innerHTML =
        (prev ? '<a class="prev" href="energy-plan-detail.html?id=' + prev.id + '"><small>← 上一方案</small>' + esc(prev.no + ' ' + prev.name) + '</a>' : '<a class="prev" href="energy-plan.html"><small>← 返回</small>九类能量方案总览</a>') +
        (next ? '<a class="next" href="energy-plan-detail.html?id=' + next.id + '"><small>下一方案 →</small>' + esc(next.no + ' ' + next.name) + '</a>' : '<a class="next" href="energy-plan.html"><small>返回 →</small>九类能量方案总览</a>');
    }

    function esc(value) { return String(value).replace(/[&<>"']/g, char => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[char])); }
    window.EMSLocalData && window.EMSLocalData.persistPage({ id: 'energy-plan-detail.html', kind: 'energy-plan-detail' });
</script>
</body>
</html>
